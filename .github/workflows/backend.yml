name: Backend

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/backend.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      # Settings() loads these at import time even though tests override
      # get_db with in-memory SQLite - values just need to be well-formed,
      # not reachable. Same trivial placeholders as back/.env.example.
      DATABASE_URL: postgresql+asyncpg://nh_auth:nh_auth@localhost:5432/nh_auth
      JWT_SECRET_KEY: local-dev-secret-not-for-production
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"
