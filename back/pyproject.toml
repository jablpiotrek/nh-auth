[project]
name = "back"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Piotr Jablonski", email = "jabl.piotrek@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors (Ruff's own baseline)
# I:   import sorting (isort)        UP: modernize syntax (pyupgrade)
# B:   likely-bug patterns (bugbear) SIM: unnecessarily complex code
# C4:  unnecessary comprehensions/literals
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
