[project]
name = "back"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Piotr Jablonski", email = "jabl.piotrek@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors (Ruff's own baseline)
# I:   import sorting (isort)        UP: modernize syntax (pyupgrade)
# B:   likely-bug patterns (bugbear) SIM: unnecessarily complex code
# C4:  unnecessary comprehensions/literals
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
