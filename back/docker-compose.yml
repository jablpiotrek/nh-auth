services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nh_auth
      POSTGRES_PASSWORD: nh_auth
      POSTGRES_DB: nh_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nh_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
